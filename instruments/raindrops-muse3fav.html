<!doctype html>
<html lang="en">
<head>
<base href="/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhythmic Rain Drops</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; background: #0c141d; color: #d0e0e3; }
  h1 { font-size: 18px; margin: 0 0 4px; color: #81d4fa; }
  .status { font-size: 13px; color: #64748b; margin-bottom: 16px; }
  .status.on { color: #38bdf8; }
  label { display: block; margin: 12px 0 2px; }
  input[type=range] { width: 100%; accent-color: #38bdf8; }
  button { font: inherit; padding: 8px 14px; margin: 8px 8px 0 0; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; cursor: pointer; }
  button:hover { background: #334155; }
  button.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
  #log { margin-top: 20px; font: 12px/1.3 ui-monospace, monospace; color: #38bdf8; height: 100px; overflow: auto; background: #030712; padding: 8px; border-radius: 4px; white-space: pre; border: 1px solid #1e293b; }
  .row { display: flex; gap: 16px; }
  .row > label { flex: 1; min-width: 0; }

  .panel { margin: 18px 0; padding: 12px; border: 1px solid #1e293b; border-radius: 6px; background: #0f172a; }
  
  #canvas-container { position: relative; width: 100%; height: 260px; background: #020617; border-radius: 6px; overflow: hidden; border: 1px solid #1e293b; margin-bottom: 12px; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: none; }
  
  #now { font: 600 24px ui-monospace, monospace; height: 32px; margin: 4px 0 2px; color: #7dd3fc; }
  #nowHz { font-size: 13px; color: #64748b; height: 18px; }
  .keyhint { font-size: 12px; color: #64748b; margin-top: 6px; }
</style>
</head>
<body>
<h1>Rhythmic Rain Drops</h1>
<div id="status" class="status">not connected</div>

<button id="start">Start sound</button>
<button id="auto">Rainfall: off</button>
<label>My name <input id="name" value="raindrops"></label>

<div class="panel">
  <div id="canvas-container">
    <canvas id="lakeCanvas"></canvas>
  </div>
  <div id="now">Click the lake to drop water</div>
  <div id="nowHz"></div>
  <div class="keyhint">Click/tap on the lake surface to drop a stone. Position maps pitch across the lake shore.</div>
</div>

<label>drop position (slide or route notes to make drops) <input id="position" type="range" min="0" max="1" step="0.001" value="0.5"></label>
<div class="row">
  <label>harmony (pitch shift) <input id="harmony" type="range" min="-12" max="12" step="1" value="0"></label>
  <label>water depth (reverb & decay) <input id="glide" type="range" min="0" max="1" step="0.001" value="0.5"></label>
</div>
<label>tempo (rain rhythm speed) <input id="tempo" type="range" min="60" max="200" step="1" value="120"></label>
<label>rain density <input id="density" type="range" min="0" max="1" step="0.001" value="0.5"></label>
<label>drop size / brightness <input id="brightness" type="range" min="0" max="1" step="0.001" value="0.5"></label>
<button id="pulse">downpour (burst)</button>

<div id="routing"></div>
<div id="log"></div>

<script src="osc-browser.min.js"></script>
<script src="dissonance.js"></script>
<script>
/* =====================================================================
   INSTRUMENT: Rhythmic Rain Drops on a Lake
   
   Visuals feature water ripples expanding across a lake upon rain drop
   impacts. Drops produce soft water-plop and tonal droplet sound synthesized
   via modal sine tones and filtered noise transients.
   
   Compatible with Dissonance network routing system.
   ===================================================================== */
const $ = (id) => document.getElementById(id);

// Canvas setup
const canvas = $("lakeCanvas");
const ctx2d = canvas.getContext("2d");
let ripples = [];

function resizeCanvas() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener("resize", resizeCanvas);

// Audio Graph
let ctx, master, delay, wetGain;

function initAudio() {
  if (ctx) return;
  ctx = audioContext();
  
  master = ctx.createDynamicsCompressor();
  const out = ctx.createGain(); 
  out.gain.value = 0.8;
  
  master.connect(out).connect(audioOut({ anchor: "auto" }));

  // Reverb/Delay simulating underwater/lake reflections
  delay = ctx.createDelay(2);
  const fb = ctx.createGain(); 
  fb.gain.value = 0.45;
  wetGain = ctx.createGain(); 
  wetGain.value = 0.35;
  
  master.connect(delay);
  delay.connect(fb);
  fb.connect(delay);
  delay.connect(wetGain);
  wetGain.connect(master);
  
  updateDelayTime();
  resizeCanvas();
  requestAnimationFrame(renderVisuals);
}

function updateDelayTime() {
  if (delay && ctx) {
    const depth = glideP.value;
    const time = Math.min(1.8, (60 / tempoP.value) * (0.5 + depth));
    delay.delayTime.setTargetAtTime(time, ctx.currentTime, 0.1);
    wetGain.gain.setTargetAtTime(0.2 + depth * 0.4, ctx.currentTime, 0.1);
  }
}

const eighth = () => 60 / tempoP.value / 2;

// Synthesize a droplet impact audio event
function playDropSound(normalizedPos, t) {
  if (!ctx) return;

  const basePitch = 220 + (normalizedPos * 880);
  const harmShift = Math.pow(2, Math.round(harmonyP.value) / 12);
  const pitch = Math.max(100, Math.min(3000, basePitch * harmShift));

  const bright = brightnessP.value;
  const decayTime = 0.1 + (1.0 - glideP.value) * 0.3;

  // Tonal water pop (Sine with fast pitch drop)
  const osc = ctx.createOscillator();
  const oscGain = ctx.createGain();
  
  osc.type = "sine";
  osc.frequency.setValueAtTime(pitch * (1.5 + bright * 2), t);
  osc.frequency.exponentialRampToValueAtTime(pitch, t + 0.015);
  
  oscGain.gain.setValueAtTime(0, t);
  oscGain.gain.linearRampToValueAtTime(0.4 * (0.5 + bright * 0.5), t + 0.003);
  oscGain.gain.exponentialRampToValueAtTime(0.0001, t + decayTime);

  // High Frequency Splash Noise
  const bufferSize = ctx.sampleRate * 0.05;
  const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    output[i] = Math.random() * 2 - 1;
  }

  const whiteNoise = ctx.createBufferSource();
  whiteNoise.buffer = noiseBuffer;

  const filter = ctx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.setValueAtTime(pitch * 2 + 1000, t);
  filter.Q.setValueAtTime(3, t);

  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.15 * bright, t);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);

  whiteNoise.connect(filter);
  filter.connect(noiseGain);
  noiseGain.connect(master);

  osc.connect(oscGain);
  oscGain.connect(master);

  osc.start(t);
  osc.stop(t + decayTime + 0.1);
  whiteNoise.start(t);
  whiteNoise.stop(t + 0.05);
}

// Visual & Audio Drop trigger
function triggerDrop(normX, normY = Math.random() * 0.6 + 0.2, t = ctx ? ctx.currentTime : 0) {
  if (!ctx) return;

  const pitchVal = normX;
  playDropSound(pitchVal, t);

  const delayMs = Math.max(0, (t - ctx.currentTime) * 1000);
  bgTimeout(() => {
    ripples.push({
      x: normX * canvas.width,
      y: normY * canvas.height,
      radius: 2,
      maxRadius: 30 + brightnessP.value * 50,
      alpha: 1.0,
      speed: 1 + (1 - glideP.value) * 2
    });

    const freqHz = (220 + normX * 880) * Math.pow(2, Math.round(harmonyP.value) / 12);
    $("now").textContent = `Drop at ${(normX * 100).toFixed(0)}% Shore`;
    $("nowHz").textContent = `${freqHz.toFixed(1)} Hz`;

    noteP.emit(Math.min(1, Math.max(0, normX)));
  }, delayMs);
}

// Visual Rendering Loop
function renderVisuals() {
  ctx2d.fillStyle = "rgba(12, 20, 29, 0.2)";
  ctx2d.fillRect(0, 0, canvas.width, canvas.height);

  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    ctx2d.beginPath();
    ctx2d.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
    ctx2d.strokeStyle = `rgba(125, 211, 252, ${r.alpha})`;
    ctx2d.lineWidth = 1.5;
    ctx2d.stroke();

    r.radius += r.speed;
    r.alpha -= 0.015;

    if (r.alpha <= 0 || r.radius >= r.maxRadius) {
      ripples.splice(i, 1);
    }
  }

  requestAnimationFrame(renderVisuals);
}

// Rainfall Sequencer
let autoOn = false, timer = null, nextT = 0;

function tick() {
  while (nextT < ctx.currentTime + lookahead()) {
    const d = eighth();
    if (Math.random() < densityP.value) {
      const posX = Math.random();
      const posY = Math.random() * 0.7 + 0.15;
      triggerDrop(posX, posY, nextT);
    }
    nextT += d;
  }
}

$("auto").onclick = () => {
  if (!ctx) $("start").click();
  autoOn = !autoOn;
  $("auto").textContent = "Rainfall: " + (autoOn ? "on" : "off");
  $("auto").classList.toggle("active", autoOn);
  if (autoOn) { 
    nextT = ctx.currentTime + 0.05; 
    timer = bgInterval(tick, 25); 
  } else { 
    clearBg(timer); 
  }
};

$("start").onclick = () => { 
  if (!ctx) initAudio(); 
  ctx.resume(); 
};

// Canvas Interaction
canvas.addEventListener("pointerdown", (e) => {
  if (!ctx) $("start").click();
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / canvas.width;
  const y = (e.clientY - rect.top) / canvas.height;
  triggerDrop(x, y, ctx.currentTime);
});

// Controls & Routing Parameters
let lastPos = -1, lastAt = 0;
const positionP = param("position", { 
  input: "position", send: "personal", listen: "",
  onChange: (v) => {
    const now = performance.now();
    if (Math.abs(v - lastPos) < 0.005 && now - lastAt < 60) return;
    lastPos = v; lastAt = now;
    if (ctx) triggerDrop(v, Math.random() * 0.6 + 0.2, ctx.currentTime);
  } 
});

const harmonyP    = param("harmony",    { input: "harmony", send: "personal", listen: "" });
const glideP      = param("glide",      { input: "glide",   send: "personal", listen: "", onChange: updateDelayTime });
const tempoP      = param("tempo",      { input: "tempo",   send: "personal", listen: "", onChange: updateDelayTime });
const densityP    = param("density",    { input: "density", maxHz: 10, epsilon: 0.01 });
const brightnessP = param("brightness", { input: "brightness", maxHz: 10, epsilon: 0.01 });
const pulseP      = param("pulse",      { input: "pulse", kind: "trigger", onChange: () => {
  if (!ctx) return;
  for (let i = 0; i < 5; i++) {
    triggerDrop(Math.random(), Math.random() * 0.7 + 0.15, ctx.currentTime + i * 0.05);
  }
}});
const noteP       = param("note",       { kind: "out", send: "personal" });

</script>
</body>
</html>
