<!doctype html>
<html lang="en">
<head>
<base href="/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awkward School Choir — Dissonance</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; background: #111; color: #eee; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .status { font-size: 13px; color: #999; margin-bottom: 16px; }
  .status.on { color: #6c6; }
  label { display: block; margin: 12px 0 2px; }
  input[type=range] { width: 100%; }
  button { font: inherit; padding: 8px 14px; margin: 8px 8px 0 0; background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  #log { margin-top: 20px; font: 12px/1.3 ui-monospace, monospace; color: #8a8; height: 120px; overflow: auto; background: #000; padding: 8px; border-radius: 4px; white-space: pre; }
</style>
</head>
<body>

<div style="margin:0 0 14px">
  <a href="/" style="color:#9cf;margin-right:14px">Home</a>
  <a href="/gallery.html" style="color:#9cf;margin-right:14px">Instrument gallery</a>
  <a href="/submit.html" style="color:#9cf">Post an instrument</a>
</div>

<h1>Awkward School Choir</h1>
<div id="status" class="status">not connected</div>

<button id="start">Start sound</button>

<label>My name <input id="name" value="choir"></label>

<label>
Choir wobble
<input id="density" type="range" min="0" max="1" step="0.001" value="0.45">
</label>

<label>
Brightness
<input id="brightness" type="range" min="0" max="1" step="0.001" value="0.45">
</label>

<label>
Pitch
<input id="pitch" type="range" min="110" max="660" step="0.1" value="330">
</label>

<button id="pulse">everyone tries harder</button>

<div id="routing"></div>
<div id="log"></div>

<script src="osc-browser.min.js"></script>
<script src="dissonance.js"></script>

<script>
/* =====================================================================
   AWKWARD SCHOOL CHOIR
   Uses the standard Dissonance networking/audio infrastructure.
   ===================================================================== */

let ctx;
let master;
let vowel1;
let vowel2;
let singers = [];
let instabilityLoop = null;

const NUM_SINGERS = 12;

document.getElementById("start").onclick = () => {
  if (ctx) return;

  ctx = audioContext();

  master = ctx.createGain();
  master.gain.value = 0.18;

  vowel1 = ctx.createBiquadFilter();
  vowel1.type = "bandpass";
  vowel1.frequency.value = 900;
  vowel1.Q.value = 4;

  vowel2 = ctx.createBiquadFilter();
  vowel2.type = "bandpass";
  vowel2.frequency.value = 1800;
  vowel2.Q.value = 3;

  master.connect(vowel1);
  master.connect(vowel2);

  const mix = ctx.createGain();
  mix.gain.value = 1;

  vowel1.connect(mix);
  vowel2.connect(mix);
  mix.connect(audioOut());

  for (let i = 0; i < NUM_SINGERS; i++) {
    const osc = ctx.createOscillator();
    osc.type = "triangle";

    const gain = ctx.createGain();
    gain.gain.value = 0.008 + Math.random() * 0.01;

    osc.connect(gain);
    gain.connect(master);

    osc.start();

    singers.push({
      osc,
      gain,
      drift: (Math.random() - 0.5) * 0.08,
      vibratoRate: 4 + Math.random() * 3,
      vibratoDepth: 1 + Math.random() * 5,
      loudness: 0.008 + Math.random() * 0.01
    });
  }

  update();

  instabilityLoop = bgInterval(() => {
    if (!ctx) return;

    const wobbleAmt = Number(density.value);

    singers.forEach(s => {
      s.drift += (Math.random() - 0.5) * 0.015 * wobbleAmt;
      s.drift = Math.max(-0.12, Math.min(0.12, s.drift));

      s.loudness = 0.005 + Math.random() * 0.018;

      s.gain.gain.setTargetAtTime(
        s.loudness,
        ctx.currentTime,
        0.2
      );
    });
  }, 400);
};

function update() {
  if (!ctx) return;

  const t = ctx.currentTime;
  const basePitch = Number(pitch.value);
  const wobbleAmt = Number(density.value);
  const bright = Number(brightness.value);

  vowel1.frequency.setTargetAtTime(
    700 + bright * 700,
    t,
    0.1
  );

  vowel2.frequency.setTargetAtTime(
    1400 + bright * 1800,
    t,
    0.1
  );

  singers.forEach((s, i) => {
    const phase = t * s.vibratoRate + i * 0.73;

    const vibrato =
      Math.sin(phase) *
      s.vibratoDepth *
      (0.4 + wobbleAmt);

    const choirError =
      s.drift * basePitch;

    const target =
      basePitch +
      choirError +
      vibrato;

    s.osc.frequency.setTargetAtTime(
      target,
      t,
      0.15
    );
  });
}

function hit() {
  if (!master || !ctx) return;

  const t = ctx.currentTime;

  master.gain.cancelScheduledValues(t);
  master.gain.setValueAtTime(master.gain.value, t);
  master.gain.linearRampToValueAtTime(0.35, t + 0.05);
  master.gain.exponentialRampToValueAtTime(0.18, t + 0.8);

  singers.forEach(s => {
    s.drift += (Math.random() - 0.5) * 0.05;
  });
}

const density = param("density", {
  input: "density",
  onChange: update
});

const brightness = param("brightness", {
  input: "brightness",
  onChange: update
});

const pitch = param("pitch", {
  input: "pitch",
  onChange: update,
  send: "personal",
  listen: ""
});

const pulse = param("pulse", {
  input: "pulse",
  kind: "trigger",
  onChange: hit
});
</script>

</body>
</html>
