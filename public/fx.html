<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ring Delay FX</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; background: #111; color: #eee; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .status { font-size: 13px; color: #999; margin-bottom: 16px; }
  .status.on { color: #6c6; }
  label { display: block; margin: 12px 0 2px; }
  input[type=range] { width: 100%; }
  button { font: inherit; padding: 8px 14px; margin: 8px 8px 0 0; background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  .src { margin: 14px 0; padding: 10px; border: 1px solid #333; border-radius: 6px; }
  .src .t { font-size: 13px; color: #aaa; }
  #log { margin-top: 20px; font: 12px/1.3 ui-monospace, monospace; color: #8a8; height: 100px; overflow: auto; background: #000; padding: 8px; border-radius: 4px; white-space: pre; }
  .val { color: #888; font-size: 13px; margin-left: 6px; }
</style>
</head>
<body>
<h1>Ring Delay FX</h1>
<div id="status" class="status">not connected</div>

<button id="start">Start sound</button>
<label>My name <input id="name" value="fx"></label>

<div class="src"><span class="t" id="inputAt">Press Start sound, then choose whose sound to process:</span></div>

<label>ring frequency <span class="val" id="ringHz"></span><input id="ringfreq" type="range" min="0" max="1" step="0.001" value="0.4"></label>
<label>ring amount <input id="ring" type="range" min="0" max="1" step="0.001" value="0.5"></label>
<label>delay time <span class="val" id="timeMs"></span><input id="time" type="range" min="0.01" max="1.2" step="0.001" value="0.33"></label>
<label>density (delay feedback) <input id="density" type="range" min="0" max="1" step="0.001" value="0.4"></label>
<label>brightness <input id="brightness" type="range" min="0" max="1" step="0.001" value="0.6"></label>
<button id="pulse">freeze (pulse)</button>

<div id="routing"></div>
<div id="log"></div>

<script src="osc-browser.min.js"></script>
<script src="dissonance.js"></script>
<script>
/* =====================================================================
   INSTRUMENT: effect that processes another player's sound

   audio in -> ring modulator -> feedback delay (filtered) -> audio out

   density     delay feedback
   brightness  filter on the output and inside the delay loop
   pulse       freeze: feedback jumps near 1 for two seconds
   ring freq, ring amount, delay time are personal
   ===================================================================== */
const $ = (id) => document.getElementById(id);
let ctx, ringOsc, ringWet, dry, delay, fb, loopFilter, outFilter, frozen = false;

const ringHz = (v) => 20 * Math.pow(100, v);          // 20 Hz .. 2 kHz

$("start").onclick = () => {
  if (ctx) return;
  ctx = audioContext();
  const input = audioIn("input", { anchor: "inputAt" });

  // ring modulator: the carrier drives a gain node's gain
  ringOsc = ctx.createOscillator(); ringOsc.frequency.value = ringHz(ringfreqP.value);
  const ringVca = ctx.createGain(); ringVca.gain.value = 0;
  ringOsc.connect(ringVca.gain); ringOsc.start();
  ringWet = ctx.createGain(); dry = ctx.createGain();
  const mix = ctx.createGain();
  input.connect(ringVca).connect(ringWet).connect(mix);
  input.connect(dry).connect(mix);

  // feedback delay with a filter in the loop
  delay = ctx.createDelay(2);
  fb = ctx.createGain();
  loopFilter = ctx.createBiquadFilter(); loopFilter.type = "lowpass";
  mix.connect(delay); delay.connect(loopFilter).connect(fb).connect(delay);

  outFilter = ctx.createBiquadFilter(); outFilter.type = "lowpass";
  const sum = ctx.createGain();
  mix.connect(sum); delay.connect(sum);
  sum.connect(outFilter).connect(audioOut());

  update();
};

function update() {
  $("ringHz").textContent = Math.round(ringHz(ringfreqP.value)) + " Hz";
  $("timeMs").textContent = Math.round(timeP.value * 1000) + " ms";
  if (!ctx) return;
  const t = ctx.currentTime;
  ringOsc.frequency.setTargetAtTime(ringHz(ringfreqP.value), t, 0.03);
  ringWet.gain.setTargetAtTime(ringP.value, t, 0.03);
  dry.gain.setTargetAtTime(1 - ringP.value, t, 0.03);
  delay.delayTime.setTargetAtTime(timeP.value, t, 0.05);
  if (!frozen) fb.gain.setTargetAtTime(densityP.value * 0.9, t, 0.05);
  const cut = 300 + brightnessP.value ** 2 * 12000;
  loopFilter.frequency.setTargetAtTime(cut, t, 0.05);
  outFilter.frequency.setTargetAtTime(cut * 1.5, t, 0.05);
}
function freeze() {
  if (!ctx) return;
  frozen = true;
  fb.gain.setTargetAtTime(0.98, ctx.currentTime, 0.01);
  clearBg(freeze.t);
  freeze.t = bgTimeout(() => { frozen = false; update(); }, 2000);
}

const ringfreqP   = param("ringfreq",   { input: "ringfreq", send: "personal", listen: "", onChange: update });
const ringP       = param("ring",       { input: "ring",     send: "personal", listen: "", onChange: update });
const timeP       = param("time",       { input: "time",     send: "personal", listen: "", onChange: update });
const densityP    = param("density",    { input: "density",    onChange: update });
const brightnessP = param("brightness", { input: "brightness", onChange: update });
const pulseP      = param("pulse",      { input: "pulse", kind: "trigger", onChange: freeze });
update();
</script>
</body>
</html>
