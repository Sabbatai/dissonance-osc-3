<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instrument gallery — Dissonance</title>
<style>
  body { font:16px/1.5 system-ui,sans-serif; max-width:820px; margin:28px auto; padding:0 18px; background:#111; color:#eee; }
  h1 { font-size:24px; margin-bottom:6px; }
  .lede,.empty,.meta { color:#aaa; }
  .nav { margin-bottom:18px; }
  a { color:#9cf; }
  .nav a { margin-right:16px; }
  #list { display:grid; gap:10px; margin-top:24px; }
  .card { border:1px solid #444; border-radius:7px; padding:14px 16px; background:#191919; }
  .card h2 { font-size:18px; margin:0 0 4px; }
  .actions { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .card a.open, .delete { display:inline-block; padding:6px 10px; border:1px solid #555; border-radius:5px; text-decoration:none; background:#292929; color:#eee; font:inherit; cursor:pointer; }
  .delete { border-color:#704040; color:#f0b6b6; }
  .delete:hover { background:#3b2020; }
</style>
</head>
<body>
<div class="nav"><a href="/">Home</a><a href="/submit.html">Post an instrument</a></div>
<h1>Instrument gallery</h1>
<p class="lede">Instruments made and shared during this workshop. New posts appear automatically.</p>
<div id="list"><p class="empty">Loading…</p></div>
<script>
const list = document.getElementById('list');
function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function refresh() {
  try {
    const r = await fetch('/api/instruments', { cache:'no-store' });
    const items = await r.json();
    if (!items.length) { list.innerHTML = '<p class="empty">Nothing has been posted yet.</p>'; return; }
    list.innerHTML = items.map(x => {
      const by = x.author ? `by ${esc(x.author)} · ` : '';
      const when = x.createdAt ? new Date(x.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
      return `<div class="card" data-id="${esc(x.id)}"><h2>${esc(x.title)}</h2><div class="meta">${by}${esc(when)}</div><div class="actions"><a class="open" href="${encodeURI(x.url)}" target="_blank" rel="noopener">Open instrument</a><button class="delete" data-id="${esc(x.id)}" data-title="${esc(x.title)}">Delete</button></div></div>`;
    }).join('');
  } catch (_) { list.innerHTML = '<p class="empty">Could not load the gallery.</p>'; }
}
list.addEventListener('click', async (event) => {
  const button = event.target.closest('.delete');
  if (!button) return;
  const id = button.dataset.id;
  const title = button.dataset.title || 'this instrument';
  if (!confirm(`Delete “${title}”? This removes it from the gallery and deletes its HTML file from the server.`)) return;

  button.disabled = true;
  button.textContent = 'Deleting…';
  try {
    const r = await fetch(`/api/instruments/${encodeURIComponent(id)}`, { method:'DELETE' });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `delete failed (${r.status})`);
    await refresh();
  } catch (err) {
    alert(err.message || 'Could not delete instrument.');
    button.disabled = false;
    button.textContent = 'Delete';
  }
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
